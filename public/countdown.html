<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17181d;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif; color: #e6e8ee; user-select: none; }
  * { box-sizing: border-box; }
  #titlebar {
    height: 32px; display: flex; align-items: center; padding: 0 4px 0 10px;
    background: #23262e; border-bottom: 1px solid rgba(255,255,255,0.08);
    -webkit-app-region: drag; user-select: none; cursor: move;
  }
  #titlebar .t-icon { font-size: 13px; margin-right: 6px; }
  #titlebar .t-title { flex: 0 1 auto; font-size: 12px; color: rgba(255,255,255,0.85);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #titlebar .t-spacer { flex: 1; }
  #titlebar .t-btn {
    -webkit-app-region: no-drag; cursor: pointer; width: 34px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: rgba(255,255,255,0.85);
    border-radius: 0; font-size: 13px; line-height: 1; padding: 0;
  }
  #titlebar .t-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #titlebar .t-btn.pin.on { color: #5c9cff; }
  #titlebar .t-btn.close:hover { background: #d23f3f; color: #fff; }

  #body { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; display: flex;
    flex-direction: column; padding: 8px 10px; gap: 6px; }
  #time {
    text-align: center; font-size: 44px; font-weight: 600; font-variant-numeric: tabular-nums;
    letter-spacing: 1px; line-height: 1.1; color: #fff; margin: 0;
    text-shadow: 0 1px 0 rgba(0,0,0,0.35); transition: color 0.3s;
  }
  #time.done { color: #ff6b6b; animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  #sub { text-align: center; font-size: 11px; color: rgba(255,255,255,0.55); line-height: 1.2; min-height: 13px; }

  .row { display: flex; align-items: center; gap: 6px; }
  .dur { display: flex; align-items: center; justify-content: center; gap: 6px; }
  .dur .lbl { font-size: 11px; color: rgba(255,255,255,0.55); }
  .step {
    -webkit-app-region: no-drag; cursor: pointer; width: 26px; height: 26px; flex: 0 0 auto;
    border: 1px solid rgba(255,255,255,0.16); background: #2a2e38; color: #e6e8ee;
    border-radius: 6px; font-size: 13px; line-height: 1; font-family: inherit; padding: 0;
  }
  .step:hover { background: #343946; }
  .step:active { transform: translateY(1px); }
  .dur input {
    -webkit-app-region: no-drag; width: 56px; height: 26px; text-align: center;
    background: #1f2229; border: 1px solid rgba(255,255,255,0.16); color: #fff;
    border-radius: 6px; font-size: 13px; font-variant-numeric: tabular-nums; font-family: inherit;
    outline: none; padding: 0 4px;
  }
  .dur input:focus { border-color: #5c9cff; }
  .dur .unit { font-size: 11px; color: rgba(255,255,255,0.55); }

  select {
    -webkit-app-region: no-drag; width: 140px; min-width: 0; height: 28px;
    background: #262a33; border: 1px solid rgba(255,255,255,0.14); color: #e6e8ee;
    border-radius: 6px; padding: 0 6px; font-size: 12px; font-family: inherit; outline: none;
  }
  select:focus { border-color: #5c9cff; }
  .ibtn {
    -webkit-app-region: no-drag; cursor: pointer; width: 34px; height: 28px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.14); background: #2a2e38; color: #e6e8ee;
    border-radius: 6px; font-size: 14px; line-height: 1; padding: 0;
  }
  .ibtn:hover { background: #343946; }
  .ibtn:active { transform: translateY(1px); }
  .ibtn.primary { background: #2b5fd9; border-color: #2b5fd9; color: #fff; }
  .ibtn.primary:hover { background: #3873ff; }
  .ibtn.run { background: #1e8e5a; border-color: #1e8e5a; color: #fff; }
  .ibtn.run:hover { background: #26ab6c; }
  .ibtn.danger { color: #ff9a9a; }
  .ibtn.danger:hover { background: #4a2a2a; color: #ffb3b3; }
  .ibtn.add { background: #5b3d99; border-color: #5b3d99; color: #fff; }
  .ibtn.add:hover { background: #6f4fc2; }
  .ibtn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

  /* 声音设置弹层 */
  #soundMask { position: fixed; inset: 0; background: rgba(10,12,16,0.72); display: none;
    align-items: center; justify-content: center; z-index: 60; }
  #soundMask.show { display: flex; }
  #soundPanel {
    width: min(94vw, 300px); background: #1d2027; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 8px;
  }
  #soundPanel h3 { margin: 0; font-size: 14px; color: #fff; }
  #soundPanel .cur { font-size: 12px; color: rgba(255,255,255,0.6); min-height: 16px; }
  #soundPanel .actions { display: flex; gap: 8px; justify-content: flex-end; }
  #soundPanel .actions .btn { cursor: pointer; height: 30px; padding: 0 14px; font-size: 12px;
    border: 1px solid rgba(255,255,255,0.14); background: #2a2e38; color: #e6e8ee; border-radius: 6px; font-family: inherit; }
  #soundPanel .actions .btn.primary { background: #2b5fd9; border-color: #2b5fd9; color: #fff; }
</style>
</head>
<body>
  <div id="titlebar">
    <span class="t-icon">⏳</span>
    <span class="t-title" id="t-title">倒计时</span>
    <span class="t-spacer"></span>
    <button class="t-btn pin" id="btn-sound" title="提醒声音设置" aria-label="声音设置">🔔</button>
    <button class="t-btn pin" id="btn-pin" title="置顶" aria-label="置顶切换">📌</button>
    <button class="t-btn" id="btn-min" title="最小化" aria-label="最小化">
      <svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="9" x2="10" y2="9" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="t-btn close" id="btn-close" title="关闭" aria-label="关闭">
      <svg width="12" height="12" viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.3"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </div>
  <div id="body">
    <div id="time">25:00</div>
    <div id="sub">就绪</div>
    <div class="row dur">
      <button class="step" id="btn-m5" title="-5 分钟">-5</button>
      <button class="step" id="btn-m1" title="-1 分钟">-1</button>
      <input type="number" id="inp-min" min="0" max="599" step="1" value="25" />
      <span class="unit">分</span>
      <button class="step" id="btn-p1" title="+1 分钟">+1</button>
      <button class="step" id="btn-p5" title="+5 分钟">+5</button>
    </div>
    <div class="row">
      <select id="selType" title="选择计时类型"></select>
      <button class="ibtn" id="btnTypes" title="管理计时类型">🏷️</button>
    </div>
    <div class="row">
      <button class="ibtn primary" id="btn-start" title="开始/暂停">▶</button>
      <button class="ibtn run" id="btn-save" title="保存本次倒计时" disabled>💾</button>
      <button class="ibtn danger" id="btn-reset" title="重置" disabled>↺</button>
      <button class="ibtn add" id="btn-new" title="新开一个倒计时窗口">＋</button>
    </div>
  </div>

  <div id="soundMask">
    <div id="soundPanel">
      <h3>⏰ 提醒声音</h3>
      <div class="row" style="align-items:center;gap:6px">
        <select id="selSound" style="flex:1;min-width:0"></select>
        <button class="ibtn" id="btnPreview" title="试听">▶</button>
      </div>
      <div class="actions">
        <button class="btn" id="soundClose">关闭</button>
      </div>
    </div>
  </div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const api = window.timerApi;
  const $time = $('time'), $sub = $('sub');
  const $btnStart = $('btn-start'), $btnSave = $('btn-save'), $btnReset = $('btn-reset');
  const $inpMin = $('inp-min'), $selType = $('selType');
  let typeList = [];

  const st = {
    total: 25 * 60,
    remain: 25 * 60,
    running: false,
    endAt: 0,
    timer: 0,
    finished: false,
    startWallAt: 0,
  };

  let audioCtx = null;
  function ensureAudio() {
    if (audioCtx) return audioCtx;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    return audioCtx;
  }
  function beep() {
    const ctx = ensureAudio();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    const playOne = (freq, start, dur) => {
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0, ctx.currentTime + start);
      g.gain.linearRampToValueAtTime(0.25, ctx.currentTime + start + 0.02);
      g.gain.linearRampToValueAtTime(0, ctx.currentTime + start + dur);
      o.connect(g).connect(ctx.destination);
      o.start(ctx.currentTime + start);
      o.stop(ctx.currentTime + start + dur + 0.05);
    };
    playOne(880, 0, 0.18);
    playOne(880, 0.28, 0.18);
    playOne(1175, 0.56, 0.32);
  }

  // ---- 提醒声音(补丁·98 + 补丁·100): 默认提示音 / 静音 / 自定义音乐 / Windows 内置 ----
  let builtinSounds = [];
  function builtinKey(s) { return String(s || '').startsWith('wav:') ? String(s).slice(4) : ''; }
  let soundCfg = { type: 'beep', name: '三声短鸣', dataUrl: '' };
  let audioEl = null;
  function reloadAudio() {
    if (soundCfg.type === 'file' && soundCfg.dataUrl) {
      try { audioEl = new Audio(soundCfg.dataUrl); } catch (e) { audioEl = null; }
    } else if (builtinKey(soundCfg.type) && soundCfg.dataUrl) {
      try { audioEl = new Audio(soundCfg.dataUrl); } catch (e) { audioEl = null; }
    } else {
      audioEl = null;
    }
  }
  async function loadSound() {
    try { soundCfg = (await api.soundGet()) || soundCfg; } catch (e) { /* ignore */ }
    reloadAudio();
  }
  function ring() {
    if (soundCfg.type === 'none') return;
    if (audioEl) {
      try { audioEl.currentTime = 0; audioEl.play().catch(() => {}); } catch (e) { /* ignore */ }
    } else {
      beep();
    }
  }
  function buildSoundSelect() {
    const sel = $('selSound');
    sel.innerHTML = '';
    const add = (val, label, disabled) => {
      const o = document.createElement('option');
      o.value = val; o.textContent = label;
      if (disabled) o.disabled = true;
      if (val === soundCfg.type) o.selected = true;
      sel.appendChild(o);
    };
    add('beep', '三声短鸣');
    add('none', '静音');
    for (const it of builtinSounds) {
      add('wav:' + it.key, (it.available ? '' : '⚠ ') + it.label + (it.available ? '' : ' (缺失)'), !it.available);
    }
    add('file', '选择音乐文件…');
    sel.value = soundCfg.type;
    $('btnPreview').disabled = (soundCfg.type === 'none') || (soundCfg.type === 'file' && !soundCfg.dataUrl);
  }
  function previewSound(v) {
    const k = builtinKey(v);
    if (k) { api.builtinPreview(k); return; }
    if (v === 'file') {
      if (audioEl) { try { audioEl.currentTime = 0; audioEl.play().catch(() => {}); } catch (e) { /* ignore */ } }
      return;
    }
    if (v === 'beep') { beep(); return; }
    // none: 静音,不试听
  }
  async function openSoundPanel() {
    await loadSound();
    await loadBuiltins();
    buildSoundSelect();
    $('soundMask').classList.add('show');
  }
  function closeSoundPanel() { $('soundMask').classList.remove('show'); }
  async function setSound(type) {
    const k = builtinKey(type);
    if (k) {
      // 补丁·100: Windows 内置声音,主进程返回 dataUrl + available
      const it = builtinSounds.find((x) => x.key === k);
      if (!it || !it.available) { buildSoundSelect(); return; }
      const r = await api.builtinGet(k);
      if (!r || !r.available || !r.dataUrl) { buildSoundSelect(); return; }
      soundCfg = { type, path: r.path || '', name: it.label, dataUrl: r.dataUrl };
      await api.soundSet({ type, path: '', name: it.label });
      reloadAudio();
      api.builtinPreview(k);
    } else if (type === 'file') {
      const r = await api.soundPick();
      if (!r || r.canceled) { buildSoundSelect(); return; }
      if (r.error) { buildSoundSelect(); return; }
      soundCfg = { type: 'file', path: r.path, name: r.name, dataUrl: r.dataUrl };
      await api.soundSet({ type: 'file', path: r.path, name: r.name });
      reloadAudio();
    } else {
      soundCfg = { type, path: '', name: type === 'none' ? '静音' : '三声短鸣', dataUrl: '' };
      await api.soundSet({ type, path: '', name: type === 'none' ? '静音' : '三声短鸣' });
      reloadAudio();
    }
    buildSoundSelect();
  }

  // 补丁·100: 拉取 Windows 内置声音清单(供下拉填充)
  async function loadBuiltins() {
    try { builtinSounds = (await api.builtinList()) || []; } catch (e) { builtinSounds = []; }
  }

  function pad(n, w) { return String(n).padStart(w, '0'); }
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    return h > 0 ? `${pad(h,2)}:${pad(m,2)}:${pad(s,2)}` : `${pad(m,2)}:${pad(s,2)}`;
  }
  function renderTime() { $time.textContent = fmt(st.remain); }
  function renderSub(txt) {
    if (txt !== undefined) { $sub.textContent = txt; return; }
    if (st.finished) $sub.textContent = '已结束';
    else if (st.running) $sub.textContent = '运行中…';
    else if (st.remain < st.total) $sub.textContent = '已暂停';
    else $sub.textContent = '就绪';
  }
  function renderTitle() { $('t-title').textContent = `倒计时 · ${Math.round(st.total / 60)} 分`; }

  function setTotal(sec, fromPreset) {
    sec = Math.max(0, Math.min(599 * 60, Math.round(sec)));
    if (st.running || st.remain < st.total) {
      const ratio = st.total > 0 ? st.remain / st.total : 0;
      st.total = sec;
      st.remain = Math.round(sec * (st.running ? 1 : ratio));
      if (st.running) st.endAt = Date.now() + st.remain * 1000;
    } else {
      st.total = sec;
      st.remain = sec;
    }
    if (fromPreset) $inpMin.value = Math.round(sec / 60);
    renderTitle(); renderTime();
  }

  function start() {
    if (st.finished) reset(false);
    if (st.remain <= 0) return;
    st.running = true;
    st.endAt = Date.now() + st.remain * 1000;
    if (!st.startWallAt) st.startWallAt = Math.floor(Date.now() / 1000);
    $btnStart.textContent = '⏸';
    $btnStart.title = '暂停';
    $btnReset.disabled = false;
    $btnSave.disabled = false;
    renderSub();
    tick();
  }
  function pause() {
    if (!st.running) return;
    st.remain = Math.max(0, Math.round((st.endAt - Date.now()) / 1000));
    st.running = false;
    clearInterval(st.timer);
    $btnStart.textContent = '▶';
    $btnStart.title = '开始';
    renderTime(); renderSub();
  }
  function reset(clearRunning) {
    if (clearRunning !== false) {
      st.running = false;
      clearInterval(st.timer);
    }
    st.remain = st.total;
    st.finished = false;
    st.endAt = 0;
    st.startWallAt = 0;
    $btnStart.textContent = '▶';
    $btnStart.title = '开始';
    $btnReset.disabled = true;
    $btnSave.disabled = true;
    $time.classList.remove('done');
    renderTime(); renderSub();
  }
  function tick() {
    clearInterval(st.timer);
    st.timer = setInterval(() => {
      const left = Math.max(0, Math.round((st.endAt - Date.now()) / 1000));
      st.remain = left;
      renderTime();
      if (left <= 0) {
        clearInterval(st.timer);
        st.running = false;
        st.finished = true;
        $btnStart.textContent = '▶';
        $time.classList.add('done');
        renderSub('⏰ 时间到!');
        ring(); // 按提醒声音设置播放(补丁·98)
      }
    }, 250);
  }

  async function loadTypes() {
    try { typeList = (await api.typeList()) || []; } catch (e) { typeList = []; }
    const cur = $selType.value;
    $selType.innerHTML = '<option value="">未分类</option>' +
      typeList.map((t) => `<option value="${t.id}">${t.icon || ''} ${t.name}</option>`).join('') +
      '<option value="__manage__" disabled>── 管理类型… ──</option>';
    if (cur && typeList.some((t) => t.id === cur)) $selType.value = cur;
  }
  async function saveRec() {
    if (st.total <= 0) { renderSub('时长为 0'); return; }
    const endTs = Math.floor(Date.now() / 1000);
    const startTs = st.startWallAt || (endTs - st.total);
    const tid = $selType.value;
    const res = await api.recAdd({
      type_ids: tid ? [tid] : [],
      start_ts: startTs,
      end_ts: endTs,
      duration_sec: st.total,
      mode: 'countdown',
      show_calendar: 1,
      note: '',
    });
    renderSub(res && res.ok ? '✅ 已保存' : '保存失败');
    if (res && res.ok) setTimeout(() => renderSub(), 1800);
  }

  $btnStart.addEventListener('click', () => { st.running ? pause() : start(); });
  $btnSave.addEventListener('click', saveRec);
  $btnReset.addEventListener('click', () => reset(true));
  $('btn-new').addEventListener('click', () => api.newCountdown());
  $('btnTypes').addEventListener('click', () => api.openManager());
  $('btn-min').addEventListener('click', () => api.minimize());
  $('btn-close').addEventListener('click', () => api.close());
  $('btn-sound').addEventListener('click', openSoundPanel);
  $('soundClose').addEventListener('click', closeSoundPanel);
  $('soundMask').addEventListener('click', (e) => { if (e.target === $('soundMask')) closeSoundPanel(); });
  $('selSound').addEventListener('change', () => setSound($('selSound').value));
  $('btnPreview').addEventListener('click', () => previewSound($('selSound').value));
  $('btn-pin').addEventListener('click', () => {
    const on = !$('btn-pin').classList.contains('on');
    $('btn-pin').classList.toggle('on', on);
    $('btn-pin').title = on ? '取消置顶' : '置顶';
    api.setTop(on);
  });
  $selType.addEventListener('change', () => {
    if ($selType.value === '__manage__') { $selType.value = ''; api.openManager(); }
  });

  $('btn-m5').addEventListener('click', () => setTotal(Math.max(0, st.total - 5 * 60), true));
  $('btn-m1').addEventListener('click', () => setTotal(Math.max(0, st.total - 60), true));
  $('btn-p1').addEventListener('click', () => setTotal(Math.min(599 * 60, st.total + 60), true));
  $('btn-p5').addEventListener('click', () => setTotal(Math.min(599 * 60, st.total + 5 * 60), true));
  $inpMin.addEventListener('change', () => {
    let v = parseInt($inpMin.value, 10);
    if (!Number.isFinite(v) || v < 0) v = 0;
    if (v > 599) v = 599;
    setTotal(v * 60, true);
  });
  $inpMin.addEventListener('keydown', (e) => { if (e.key === 'Enter') $inpMin.blur(); });

  window.timerApi.onInit((cfg) => {
    const sec = Math.max(0, Math.min(599 * 60, Number(cfg && cfg.duration) || 25 * 60));
    setTotal(sec, true);
    if (cfg && cfg.title) $('t-title').textContent = cfg.title;
    if (cfg && cfg.focusInput) {
      setTimeout(() => { try { $inpMin.focus(); $inpMin.select(); } catch (e) { /* ignore */ } }, 50);
    }
  });

  setTotal(25 * 60, true);
  loadTypes();
  loadSound();
})();
</script>
</body>
</html>

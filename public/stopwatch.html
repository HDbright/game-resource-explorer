<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17181d;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif; color: #e6e8ee; user-select: none; }
  * { box-sizing: border-box; }
  #titlebar {
    height: 32px; display: flex; align-items: center; padding: 0 4px 0 10px;
    background: #23262e; border-bottom: 1px solid rgba(255,255,255,0.08);
    -webkit-app-region: drag; user-select: none; cursor: move;
  }
  #titlebar .t-icon { font-size: 13px; margin-right: 6px; }
  #titlebar .t-title { flex: 0 1 auto; font-size: 12px; color: rgba(255,255,255,0.85);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #titlebar .t-spacer { flex: 1; }
  #titlebar .t-btn {
    -webkit-app-region: no-drag; cursor: pointer; width: 34px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: rgba(255,255,255,0.85);
    border-radius: 0; font-size: 13px; line-height: 1; padding: 0;
  }
  #titlebar .t-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #titlebar .t-btn.pin.on { color: #5c9cff; }
  #titlebar .t-btn.close:hover { background: #d23f3f; color: #fff; }

  #body { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; display: flex;
    flex-direction: column; padding: 8px 10px 8px; gap: 6px; }
  #time {
    text-align: center; font-size: 40px; font-weight: 600; font-variant-numeric: tabular-nums;
    letter-spacing: 1px; line-height: 1.1; color: #fff; margin: 0;
    text-shadow: 0 1px 0 rgba(0,0,0,0.35);
  }
  #sub { text-align: center; font-size: 11px; color: rgba(255,255,255,0.55); line-height: 1.2; min-height: 13px; }

  .row { display: flex; align-items: center; gap: 6px; }
  select {
    -webkit-app-region: no-drag; width: 140px; min-width: 0; height: 28px;
    background: #262a33; border: 1px solid rgba(255,255,255,0.14); color: #e6e8ee;
    border-radius: 6px; padding: 0 6px; font-size: 12px; font-family: inherit; outline: none;
  }
  select:focus { border-color: #5c9cff; }
  .ibtn {
    -webkit-app-region: no-drag; cursor: pointer; width: 34px; height: 28px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid rgba(255,255,255,0.14); background: #2a2e38; color: #e6e8ee;
    border-radius: 6px; font-size: 14px; line-height: 1; padding: 0;
  }
  .ibtn:hover { background: #343946; }
  .ibtn:active { transform: translateY(1px); }
  .ibtn.primary { background: #2b5fd9; border-color: #2b5fd9; color: #fff; }
  .ibtn.primary:hover { background: #3873ff; }
  .ibtn.run { background: #1e8e5a; border-color: #1e8e5a; color: #fff; }
  .ibtn.run:hover { background: #26ab6c; }
  .ibtn.danger { color: #ff9a9a; }
  .ibtn.danger:hover { background: #4a2a2a; color: #ffb3b3; }
  .ibtn.add { background: #5b3d99; border-color: #5b3d99; color: #fff; }
  .ibtn.add:hover { background: #6f4fc2; }
  .ibtn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
  .ibtn.save-on { background: #1e8e5a; border-color: #1e8e5a; color: #fff; }
</style>
</head>
<body>
  <div id="titlebar">
    <span class="t-icon">⏱️</span>
    <span class="t-title" id="t-title">秒表</span>
    <span class="t-spacer"></span>
    <button class="t-btn pin" id="btn-pin" title="置顶" aria-label="置顶切换">📌</button>
    <button class="t-btn" id="btn-min" title="最小化" aria-label="最小化">
      <svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="9" x2="10" y2="9" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="t-btn close" id="btn-close" title="关闭" aria-label="关闭">
      <svg width="12" height="12" viewBox="0 0 12 12"><line x1="3" y1="3" x2="9" y2="9" stroke="currentColor" stroke-width="1.3"/><line x1="9" y1="3" x2="3" y2="9" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </div>
  <div id="body">
    <div id="time">00:00:00</div>
    <div id="sub">就绪</div>
    <div class="row">
      <select id="selType" title="选择计时类型"></select>
      <button class="ibtn" id="btnTypes" title="管理计时类型">🏷️</button>
    </div>
    <div class="row">
      <button class="ibtn primary" id="btn-start" title="开始/暂停">▶</button>
      <button class="ibtn" id="btn-lap" title="计次" disabled>⏱</button>
      <button class="ibtn run" id="btn-save" title="保存本次计时" disabled>💾</button>
      <button class="ibtn danger" id="btn-reset" title="重置" disabled>↺</button>
      <button class="ibtn add" id="btn-new" title="新开一个计时窗口">＋</button>
    </div>
  </div>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const api = window.timerApi;
  const $time = $('time'), $sub = $('sub');
  const $btnStart = $('btn-start'), $btnLap = $('btn-lap'), $btnSave = $('btn-save'), $btnReset = $('btn-reset');
  const $selType = $('selType');
  let typeList = [];

  const state = {
    running: false,
    startedAt: 0,   // performance.now() at start
    elapsed: 0,     // ms accumulated before this run
    laps: [],
    raf: 0,
  };

  function pad(n, w) { return String(n).padStart(w, '0'); }
  function fmt(ms) {
    const totalS = Math.floor(ms / 1000);
    const s = totalS % 60;
    const totalM = Math.floor(totalS / 60);
    const m = totalM % 60;
    const h = Math.floor(totalM / 60);
    return { h, m, s, main: `${pad(h,2)}:${pad(m,2)}:${pad(s,2)}` };
  }
  function current() { return state.elapsed + (state.running ? (performance.now() - state.startedAt) : 0); }
  function curSec() { return Math.floor(current() / 1000); }

  function render() { $time.textContent = fmt(current()).main; }
  function renderSub(txt) {
    if (txt !== undefined) $sub.textContent = txt;
    else if (state.running) $sub.textContent = '运行中…';
    else if (state.elapsed > 0) $sub.textContent = '已暂停';
    else $sub.textContent = '就绪';
  }
  function tick() { render(); if (state.running) state.raf = requestAnimationFrame(tick); }

  function start() {
    if (state.running) return;
    state.running = true;
    state.startedAt = performance.now();
    $btnStart.textContent = '⏸';
    $btnStart.title = '暂停';
    $btnLap.disabled = false;
    $btnReset.disabled = false;
    $btnSave.disabled = false;
    renderSub();
    tick();
  }
  function pause() {
    if (!state.running) return;
    state.elapsed += performance.now() - state.startedAt;
    state.running = false;
    cancelAnimationFrame(state.raf);
    $btnStart.textContent = '▶';
    $btnStart.title = '开始';
    render(); renderSub();
  }
  function reset() {
    state.running = false;
    state.elapsed = 0; state.startedAt = 0; state.laps = [];
    cancelAnimationFrame(state.raf);
    $btnStart.textContent = '▶';
    $btnStart.title = '开始';
    $btnLap.disabled = true;
    $btnReset.disabled = true;
    $btnSave.disabled = true;
    render(); renderSub();
  }

  async function loadTypes() {
    try { typeList = (await api.typeList()) || []; } catch (e) { typeList = []; }
    const cur = $selType.value;
    $selType.innerHTML = '<option value="">未分类</option>' +
      typeList.map((t) => `<option value="${t.id}">${t.icon || ''} ${t.name}</option>`).join('') +
      '<option value="__manage__" disabled>── 管理类型… ──</option>';
    if (cur && typeList.some((t) => t.id === cur)) $selType.value = cur;
  }
  async function saveRec() {
    const durationSec = curSec();
    if (durationSec <= 0) { renderSub('时长不足 1 秒'); return; }
    const endTs = Math.floor(Date.now() / 1000);
    const tid = $selType.value;
    const res = await api.recAdd({
      type_ids: tid ? [tid] : [],
      start_ts: endTs - durationSec,
      end_ts: endTs,
      duration_sec: durationSec,
      mode: 'stopwatch',
      show_calendar: 1,
      note: '',
    });
    renderSub(res && res.ok ? '✅ 已保存' : '保存失败');
    if (res && res.ok) setTimeout(() => renderSub(), 1800);
  }

  $btnStart.addEventListener('click', () => { state.running ? pause() : start(); });
  $btnLap.addEventListener('click', () => {
    if (!state.running) return;
    const t = current();
    const lastTotal = state.laps.length ? state.laps[state.laps.length - 1].total : 0;
    state.laps.push({ split: t - lastTotal, total: t });
    const f = fmt(t);
    renderSub(`#${state.laps.length} 计次 ${f.main}`);
  });
  $btnSave.addEventListener('click', saveRec);
  $btnReset.addEventListener('click', reset);
  $('btn-new').addEventListener('click', () => api.newStopwatch());
  $('btnTypes').addEventListener('click', () => api.openManager());
  $('btn-min').addEventListener('click', () => api.minimize());
  $('btn-close').addEventListener('click', () => api.close());
  $('btn-pin').addEventListener('click', () => {
    const on = !$('btn-pin').classList.contains('on');
    $('btn-pin').classList.toggle('on', on);
    $('btn-pin').title = on ? '取消置顶' : '置顶';
    api.setTop(on);
  });
  $selType.addEventListener('change', () => {
    if ($selType.value === '__manage__') { $selType.value = ''; api.openManager(); }
  });

  $('t-title').textContent = '秒表';
  loadTypes();
  render();
})();
</script>
</body>
</html>

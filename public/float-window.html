<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #17181d;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  /* 标题栏: app-region drag 提供原生窗口拖拽(可移动悬浮窗) */
  #titlebar {
    height: 32px; display: flex; align-items: center; padding: 0 4px 0 10px;
    background: #23262e; border-bottom: 1px solid rgba(255,255,255,0.08);
    -webkit-app-region: drag; user-select: none; cursor: move;
  }
  #titlebar .t-icon { font-size: 13px; margin-right: 6px; }
  #titlebar .t-title { flex: 0 1 auto; font-size: 12px; color: rgba(255,255,255,0.85);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* 占位符把窗口控制按钮推到右侧, 与系统标题栏顺序一致: 最小化 | 最大化/还原 | 关闭 */
  #titlebar .t-spacer { flex: 1; }
  #titlebar .t-btn {
    -webkit-app-region: no-drag; cursor: pointer; width: 38px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    border: none; background: transparent; color: rgba(255,255,255,0.85);
    border-radius: 0; font-size: 13px; line-height: 1; margin-left: 0;
  }
  #titlebar .t-btn svg { display: block; }
  #titlebar .t-btn:hover { background: rgba(255,255,255,0.12); color: #fff; }
  #titlebar .t-btn.min:hover { background: #3a4456; }
  #titlebar .t-btn.max:hover { background: #3a4456; }
  #titlebar .t-btn.close:hover { background: #d23f3f; color: #fff; }
  /* 内容区: 网页视图挂载处 */
  #content { position: absolute; top: 32px; left: 0; right: 0; bottom: 0; background: #101216; }
</style>
</head>
<body>
  <div id="titlebar">
    <span class="t-icon">🌐</span>
    <span class="t-title" id="t-title">网页悬浮窗</span>
    <span class="t-spacer"></span>
    <button class="t-btn min" id="btn-min" title="最小化" aria-label="最小化">
      <svg width="14" height="14" viewBox="0 0 14 14"><line x1="3" y1="10.5" x2="11" y2="10.5" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="t-btn max" id="btn-max" title="最大化" aria-label="最大化">
      <svg width="14" height="14" viewBox="0 0 14 14"><rect x="2.5" y="2.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
    <button class="t-btn close" id="btn-close" title="关闭" aria-label="关闭">
      <svg width="14" height="14" viewBox="0 0 14 14"><line x1="3.5" y1="3.5" x2="10.5" y2="10.5" stroke="currentColor" stroke-width="1.3"/><line x1="10.5" y1="3.5" x2="3.5" y2="10.5" stroke="currentColor" stroke-width="1.3"/></svg>
    </button>
  </div>
  <div id="content"></div>
  <script>
    const SVG_MAX = '<svg width="14" height="14" viewBox="0 0 14 14"><rect x="2.5" y="2.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>';
    const SVG_RESTORE = '<svg width="14" height="14" viewBox="0 0 14 14"><rect x="2" y="2" width="6.5" height="6.5" fill="none" stroke="currentColor" stroke-width="1.1"/><rect x="5.5" y="5.5" width="6.5" height="6.5" fill="#23262e" stroke="currentColor" stroke-width="1.1"/></svg>';
    const el = document.getElementById('t-title');
    window.floatApi.onInfo((d) => { if (d && d.title) el.textContent = d.title; });
    // 最小化 → 隐藏到系统任务栏; 最大化/还原 → 切换; 关闭 → 真正关闭悬浮窗
    document.getElementById('btn-min').addEventListener('click', () => window.floatApi.minimize());
    document.getElementById('btn-max').addEventListener('click', () => window.floatApi.toggleMax());
    document.getElementById('btn-close').addEventListener('click', () => window.floatApi.close());
    // 主进程转发的最大化状态 → 切换按钮图标(单框=最大化, 重叠双框=还原, 系统风格)
    window.floatApi.onMaxState((d) => {
      const btn = document.getElementById('btn-max');
      const maximized = !!(d && d.maximized);
      btn.title = maximized ? '向下还原' : '最大化';
      btn.innerHTML = maximized ? SVG_RESTORE : SVG_MAX;
    });
  </script>
</body>
</html>

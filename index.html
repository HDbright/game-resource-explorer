<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:" />
  <title>游戏资源管理器</title>
</head>
<body>
  <!-- 启动骨架屏:渲染进程首帧即可绘制(纯内联 CSS, 不等 JS), 消除黑屏等待; main() 渲染完成后移除 -->
  <div id="splash">
    <style>
      #splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;
        background:#1b1d23;font-family:"Microsoft YaHei","Segoe UI",sans-serif;user-select:none}
      .splash-inner{text-align:center;color:rgba(255,255,255,0.85)}
      .splash-logo{font-size:42px;margin-bottom:14px}
      .splash-name{font-size:19px;font-weight:600;letter-spacing:2px;margin-bottom:18px}
      .splash-bar{width:220px;height:4px;border-radius:2px;background:rgba(255,255,255,0.12);overflow:hidden;margin:0 auto}
      .splash-bar-fill{height:100%;width:35%;border-radius:2px;background:#5c9cff;
        animation:splashMove 1.1s ease-in-out infinite}
      @keyframes splashMove{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
    </style>
    <div class="splash-inner">
      <div class="splash-logo">🎮</div>
      <div class="splash-name">游戏资源管理器</div>
      <div class="splash-bar"><div class="splash-bar-fill"></div></div>
    </div>
  </div>
  <div id="app">
    <header class="toolbar">
      <!-- 资源树显示/隐藏切换按钮:纯图标(左竖条+右侧区域+▶三角), 不高亮 -->
      <button class="btn sm tree-toggle" id="btn-toggle-side" title="显示资源树"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="1.5" width="4.5" height="13" rx="1"/><rect x="6.5" y="1.5" width="8.5" height="13" rx="1"/><polyline points="10.5,6 12.5,8 10.5,10"/></svg></button>
      <div class="brand"><span class="brand-ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>首页</div>
      <!-- 覆盖式页面(资源工具箱 / 游戏场景管理)返回按钮:点击回到资源浏览区 -->
      <button class="btn sm nav-back" id="btn-back-special" hidden>← 返回</button>
      <!-- 面包屑导航:主页 / 分类路径 -->
      <nav class="breadcrumb" id="breadcrumb"></nav>
      <!-- 后台播放迷你条:音频在非预览页继续播放时显示 -->
      <div class="audio-mini" id="audio-mini" hidden>
        <span class="am-ico">♪</span>
        <span class="am-name" id="audio-mini-name" title="点击返回音频预览页">—</span>
        <button class="icon-btn sm" id="audio-mini-prev" title="上一首">⏮</button>
        <button class="icon-btn sm" id="audio-mini-play" title="播放/暂停">▶</button>
        <button class="icon-btn sm" id="audio-mini-next" title="下一首">⏭</button>
        <button class="icon-btn sm" id="audio-mini-close" title="停止播放">✕</button>
      </div>
      <div class="toolbar-actions">
        <div class="cdp-ind" id="cdp-ind" title="Chrome DevTools 调试服务状态">
          <span class="cdp-dot" id="cdp-dot"></span>
          <span class="cdp-tooltip" id="cdp-tip">检测中…</span>
        </div>
        <div class="search-box">
          <input id="search" type="text" placeholder="搜索名称 / 备注…" autocomplete="off" />
          <button id="search-clear" class="search-clear" type="button" title="清空搜索" hidden>×</button>
          <div id="search-history" class="search-history" hidden></div>
        </div>
        <button class="btn" id="btn-add">+ 添加资源</button>
        <button class="btn" id="btn-debug" title="调试模式：开启后鼠标悬停组件即显示其名称/中文名/尺寸/子组件/源码位置等信息">🐞 调试</button>
        <button class="btn" id="btn-settings" title="设置">⚙ 设置</button>
      </div>
    </header>

    <div class="main">
      <aside class="sidebar" id="sidebar">
        <!-- 资源类型标签:动画 / 图片 / 音频 / 3D(点击品牌名或面包屑「主页」回到统计主页) -->
        <div class="resource-tabs" id="resource-tabs">
          <button class="tab" data-tab="anim">动画</button>
          <button class="tab" data-tab="image">图片</button>
          <button class="tab" data-tab="audio">音频</button>
          <button class="tab" data-tab="3d">3D</button>
        </div>
        <div class="cat-tree" id="cat-tree"></div>
      </aside>

      <section class="content-panel" id="content-panel">
        <!-- 主区多标签页条(资源/功能页标签,可切换/关闭) -->
        <div class="tab-strip" id="tab-strip"></div>
        <!-- 主页:各类资源统计与目录快捷入口 -->
        <div class="page page-home" id="page-home"></div>

        <!-- 音频播放器主页:分类目录作为播放列表 + 自建播放列表标签页 + 播放器 -->
        <div class="page page-audio-home" id="page-audio-home" hidden></div>

        <!-- 目录列表页:某目录下的资源总列表 + 统计 + 视图切换 + 排序 -->
        <div class="page page-folder" id="page-folder" hidden></div>

        <!-- 预览页:动画播放器 / 图片查看器 / 音频播放器 -->
        <div class="page page-preview" id="page-preview" hidden>
          <div class="preview-panel">
            <div class="preview-head">
              <div class="ph-left">
                <button class="btn sm" id="pv-back" title="返回目录列表">← 返回</button>
                <span class="type-badge" id="pv-type"></span>
                <span class="type-badge atlas-badge" id="pv-atlas-badge" hidden title="该图片带同名 .atlas 图集">🗂 图集</span>
                <span class="pv-name" id="pv-name"></span>
                <span class="pv-version" id="pv-version"></span>
                <span class="pv-path" id="pv-path" title=""></span>
              </div>
              <div class="ph-right">
                <button class="icon-btn" id="img-chrome" title="隐藏/显示上下工具栏(沉浸查看)" type="button" hidden>⇕</button>
                <button class="btn sm" id="img-fullscreen" title="全屏预览(隐藏标题栏/顶栏/侧栏/标签条)" type="button" hidden>⛶ 全屏</button>
                <button class="btn sm" id="pv-atlas-open" hidden title="进入图集拆分浏览">🗂 图集拆分</button>
                <button class="btn sm" id="pv-open-dir">打开目录</button>
                <button class="btn sm" id="pv-reload">重新加载</button>
              </div>
            </div>

            <!-- 动画预览(保留全部原控件 id) -->
            <div id="pv-anim-view">
              <div class="preview-body" id="preview-body">
                <div class="pv-canvas-wrap" id="pv-canvas-wrap">
                  <canvas id="pv-canvas"></canvas>
                  <div class="pv-error" id="pv-error" hidden></div>
                  <!-- 前后资源切换浮层:悬停画面左侧/右侧时浮现(图标,非文字) -->
                  <div class="pv-nav-zone left" title="上一个"><button class="pv-nav-btn" type="button" data-nav="prev" title="上一个"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg></button></div>
                  <div class="pv-nav-zone right" title="下一个"><button class="pv-nav-btn" type="button" data-nav="next" title="下一个"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button></div>
                </div>
                <div class="preview-controls">
                  <div class="ctrl-row">
                    <label class="ctrl-label">播放模式</label>
                    <div class="seg" id="mode-seg">
                      <button data-mode="loop" class="seg-btn active">循环</button>
                      <button data-mode="once" class="seg-btn">单次</button>
                      <button data-mode="single" class="seg-btn">单帧</button>
                    </div>
                    <button class="icon-btn" id="btn-play" title="播放/暂停">⏸</button>
                    <button class="icon-btn" id="btn-restart" title="重新播放">↺</button>
                    <label class="ctrl-label" style="margin-left:14px">倍速</label>
                    <input type="range" id="speed-range" min="0.1" max="3" step="0.05" value="1" />
                    <span class="speed-val" id="speed-val">1.0x</span>
                    <label class="ctrl-label" style="margin-left:12px">缩放</label>
                    <input type="range" id="zoom-range" min="5" max="400" step="1" value="100" title="缩放(也可用滚轮)" />
                    <span class="zoom-val" id="zoom-val">100%</span>
                    <select id="zoom-mode" title="打开动画时的默认缩放方式">
                      <option value="fit">适配窗口</option>
                      <option value="100">100%</option>
                      <option value="fixed">固定缩放比例</option>
                      <option value="dynamic">动态缩放</option>
                    </select>
                  </div>
                  <div class="ctrl-row single-row" id="single-row" hidden>
                    <button class="icon-btn" id="frame-home" title="开头">⏮</button>
                    <button class="icon-btn" id="frame-prev" title="上一帧">◀</button>
                    <input type="range" id="frame-slider" min="0" max="100" step="0.1" value="0" />
                    <button class="icon-btn" id="frame-next" title="下一帧">▶</button>
                    <button class="icon-btn" id="frame-end" title="末尾">⏭</button>
                    <span class="frame-val" id="frame-val">0.00s / 0.00s</span>
                  </div>
                  <div class="ctrl-row">
                    <label class="ctrl-label">动作</label>
                    <button class="icon-btn" id="anim-prev" title="上一个动作">◀</button>
                    <select id="anim-select"></select>
                    <button class="icon-btn" id="anim-next" title="下一个动作">▶</button>
                    <span class="anim-dur" id="anim-dur"></span>
                    <label class="ctrl-label" style="margin-left:14px">背景</label>
                    <input type="color" id="bg-color" value="#22242b" title="调色盘选背景色(立即生效)" />
                    <button class="btn sm bg-save-btn" id="bg-save" title="把调色盘当前颜色保存为自定义颜色">存</button>
                    <button class="btn sm" id="bg-dark" title="深色背景 #22242b">深</button>
                    <button class="btn sm" id="bg-light" title="浅色背景 #eef0f5">浅</button>
                    <button class="btn sm" id="bg-custom" title="使用自定义颜色">自定</button>
                    <label class="chk"><input type="checkbox" id="show-bones" /> 骨骼</label>
                    <label class="chk"><input type="checkbox" id="flip-x" /> 镜像</label>
                    <button class="icon-btn" id="btn-rotate" title="旋转 90°">↻</button>
                    <button class="btn sm" id="pv-capture" title="截图当前帧(透明背景 PNG/WebP)">📷 截图</button>
                    <div class="ctrl-spacer"></div>
                    <span class="status" id="pv-status"></span>
                  </div>
                  <div class="ctrl-row slot-row" id="slot-row" hidden>
                    <label class="ctrl-label">插槽</label>
                    <button class="btn sm" id="slot-all">全部显示</button>
                    <button class="btn sm" id="slot-none">全部隐藏</button>
                    <div class="slot-list" id="slot-list"></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- 图片预览 -->
            <div id="pv-image-view" hidden>
              <div class="img-canvas-wrap" id="img-canvas-wrap">
                <img id="img-display" draggable="false" alt="" />
                <div class="pv-error" id="img-error" hidden></div>
                <!-- 前后资源切换浮层:悬停画面左侧/右侧时浮现(图标,非文字) -->
                <div class="pv-nav-zone left" title="上一张"><button class="pv-nav-btn" type="button" data-nav="prev" title="上一张"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 6 9 12 15 18"/></svg></button></div>
                <div class="pv-nav-zone right" title="下一张"><button class="pv-nav-btn" type="button" data-nav="next" title="下一张"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg></button></div>
              </div>
              <div class="preview-controls">
                <div class="ctrl-row">
                  <label class="ctrl-label">缩放</label>
                  <input type="range" id="img-zoom-range" min="5" max="400" step="1" value="100" title="缩放(也可用滚轮)" />
                  <span class="zoom-val" id="img-zoom-val">100%</span>
                  <button class="btn sm" id="img-fit">适配窗口</button>
                  <button class="btn sm" id="img-actual">100%</button>
                  <span class="ctrl-sep"></span>
                  <button class="icon-btn" id="img-rotate-left" title="逆时针旋转 90°">↺</button>
                  <button class="icon-btn" id="img-rotate" title="顺时针旋转 90°">↻</button>
                  <button class="icon-btn" id="img-flip-h" title="水平镜像(左右翻转)">⇋</button>
                  <button class="icon-btn" id="img-flip-v" title="垂直镜像(上下翻转)">⇅</button>
                  <button class="icon-btn" id="img-reset" title="重置视图(清除旋转/镜像,恢复适配窗口)">⟲</button>
                  <button class="btn sm" id="img-save-edit" title="把旋转/镜像修改保存到原文件(会覆盖原图)" hidden>💾 保存</button>
                  <label class="ctrl-label" style="margin-left:14px">背景</label>
                  <span class="bg-popover-wrap">
                    <button class="btn sm" id="img-bg-trigger" type="button" title="背景色(点击弹出深/浅/自定义/调色板)" aria-haspopup="dialog" aria-expanded="false">▾</button>
                    <div class="bg-popover" id="img-bg-popover" hidden>
                      <div class="bg-pop-row"><span class="ctrl-label">调色</span><input type="color" id="img-bg-color" value="#22242b" title="调色盘选背景色(立即生效)" /><button class="btn sm bg-save-btn" id="img-bg-save" title="把当前颜色保存为自定义">存</button></div>
                      <div class="bg-pop-row"><button class="btn sm" id="img-bg-dark" title="深色背景">深</button><button class="btn sm" id="img-bg-light" title="浅色背景">浅</button><button class="btn sm" id="img-bg-custom" title="应用自定义颜色">自定</button></div>
                    </div>
                  </span>
                  <div class="ctrl-spacer"></div>
                  <span class="status" id="img-status"></span>
                </div>
              </div>
            </div>

            <!-- 音频预览:完整播放器(队列/模式/变速/播放列表) -->
            <div id="pv-audio-view" hidden>
              <div class="audio-player">
                <div class="ap-main">
                  <div class="audio-art" id="audio-art">♪</div>
                  <div class="audio-meta">
                    <div class="pv-name" id="audio-name"></div>
                    <div class="pv-path" id="audio-path"></div>
                    <div class="audio-meta-ops">
                      <span class="status" id="audio-status"></span>
                    </div>
                  </div>
                </div>
                <div class="audio-controls">
                  <button class="icon-btn" id="audio-prev" title="上一首">⏮</button>
                  <button class="icon-btn" id="audio-play" title="播放/暂停">▶</button>
                  <button class="icon-btn" id="audio-next" title="下一首">⏭</button>
                  <span class="frame-val" id="audio-time">0:00 / 0:00</span>
                  <input type="range" id="audio-progress" min="0" max="1000" step="1" value="0" title="进度" />
                  <label class="ctrl-label">音量</label>
                  <input type="range" id="audio-volume" min="0" max="100" step="1" value="100" title="音量" />
                  <label class="ctrl-label">倍速</label>
                  <select id="audio-rate" title="变速播放">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                  </select>
                  <label class="ctrl-label">模式</label>
                  <select id="audio-mode" title="播放模式">
                    <option value="single">单次播放</option>
                    <option value="loop">单曲循环</option>
                    <option value="dirOrder">当前目录顺序</option>
                    <option value="dirLoop">当前目录循环</option>
                    <option value="listOrder">列表顺序</option>
                    <option value="listLoop">列表循环</option>
                  </select>
                </div>
                <div class="audio-listbar">
                  <label class="ctrl-label">播放列表</label>
                  <select id="audio-list-select" title="切换当前播放列表"><option value="">(无)</option></select>
                  <button class="btn sm" id="audio-list-add" title="把音频文件添加到当前播放列表(可多选)">+ 添加音频</button>
                  <button class="btn sm" id="audio-list-new">新建</button>
                  <button class="btn sm" id="audio-list-manage">管理列表</button>
                </div>
                <div class="audio-queue" id="audio-queue"></div>
              </div>
              <audio id="audio-el" preload="metadata"></audio>
            </div>

            <!-- 视频播放器(mp4/webm 等;原生 controls + 倍速) -->
            <div id="pv-video-view" hidden>
              <div class="video-wrap">
                <video id="video-el" controls preload="metadata" playsinline></video>
                <div class="video-toolbar">
                  <label class="ctrl-label">倍速</label>
                  <select id="video-rate" title="变速播放">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>1x</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                  </select>
                  <span class="status" id="video-status"></span>
                </div>
              </div>
            </div>

            <!-- Markdown 查看/编辑器(分栏编辑+预览,参考 MarkText) -->
            <div id="pv-markdown-view" hidden>
              <div class="md-editor">
                <div class="md-toolbar">
                  <span class="md-name" id="md-name">(未打开文件)</span><span class="dirty-dot" id="md-dirty" title="有未保存的改动" hidden></span>
                  <span class="ctrl-spacer"></span>
                  <button class="btn sm" id="md-new" title="新建空白 Markdown 文档">＋ 新建</button>
                  <button class="md-mode-btn active" data-mode="split" id="md-mode-split" title="分栏:左侧编辑、右侧预览">分栏</button>
                  <button class="md-mode-btn" data-mode="preview" id="md-mode-preview" title="仅预览渲染结果">预览</button>
                  <button class="md-mode-btn" data-mode="edit" id="md-mode-edit" title="仅编辑源码">编辑</button>
                  <button class="btn sm" id="md-sync" title="同步关联:分栏模式下编辑与预览的滚动位置、选中文字双向联动">🔗 同步</button>
                  <button class="btn sm" id="md-open" title="打开本地 Markdown 文件">📂 打开</button>
                  <button class="btn sm" id="md-add-lib" title="把当前打开的文档加入资源库指定分类(如「文档资源」)">＋ 加入库</button>
                  <button class="btn sm" id="md-save-as" title="另存为到指定路径">💾 另存为</button>
                  <button class="btn sm" id="md-save" title="保存回写原文件(Ctrl+S)">💾 保存</button>
                  <button class="btn sm" id="md-copy" title="复制源码">📋</button>
                  <span class="ctrl-sep"></span>
                  <button class="btn sm" id="md-emoji" title="在光标处插入 emoji 图标">😀 emoji</button>
                  <button class="btn sm" id="md-table" title="插入指定行/列的表格">▦ 表格</button>
                  <button class="btn sm" id="md-text-color" title="为选中文字设置颜色">🖍 文字色</button>
                  <button class="btn sm" id="md-heading-color" title="设置预览各级标题(H1–H6)颜色">🎨 标题色</button>
                  <button class="btn sm" id="md-find" title="查找 / 替换(Ctrl+F)">🔍 查找</button>
                  <span class="status" id="md-status"></span>
                </div>
                <div class="md-find-bar" id="md-find-bar" hidden>
                  <input type="text" id="md-find-q" class="find-input" placeholder="查找…" spellcheck="false" />
                  <span class="find-count" id="md-find-count"></span>
                  <button class="btn xs" id="md-find-prev" title="上一个(Shift+Enter)">↑</button>
                  <button class="btn xs" id="md-find-next" title="下一个(Enter)">↓</button>
                  <label class="find-opt" title="区分大小写"><input type="checkbox" id="md-find-case" /> Aa</label>
                  <label class="find-opt" title="全词匹配"><input type="checkbox" id="md-find-word" /> 全词</label>
                  <span class="find-sep"></span>
                  <input type="text" id="md-replace-q" class="find-input" placeholder="替换为…" spellcheck="false" />
                  <button class="btn xs" id="md-replace-one" title="替换当前匹配(Enter)">替换</button>
                  <button class="btn xs" id="md-replace-all" title="全部替换(Shift+Enter)">全部</button>
                  <button class="btn xs find-close" id="md-find-close" title="关闭(Esc)">✕</button>
                </div>
                <div class="md-body">
                  <div class="md-col md-edit-col" id="md-edit-col">
                    <textarea id="md-edit" spellcheck="false" placeholder="在此编辑 Markdown..."></textarea>
                  </div>
                  <div class="md-col md-preview-col" id="md-preview-col">
                    <div class="md-preview" id="md-preview"><div class="hint">输入内容或打开文件后在此预览渲染结果</div></div>
                  </div>
                </div>
              </div>
            </div>

            <!-- HTML 查看/编辑器(分栏编辑+iframe 预览,参考 Markdown 编辑器) -->
            <div id="pv-html-view" hidden>
              <div class="html-editor">
                <div class="html-toolbar">
                  <span class="html-name" id="html-name">(未打开文件)</span><span class="dirty-dot" id="html-dirty" title="有未保存的改动" hidden></span>
                  <span class="ctrl-spacer"></span>
                  <button class="btn sm" id="html-new" title="新建空白 HTML 文档">＋ 新建</button>
                  <button class="html-mode-btn active" data-mode="split" id="html-mode-split" title="分栏:左侧编辑、右侧预览渲染结果">分栏</button>
                  <button class="html-mode-btn" data-mode="preview" id="html-mode-preview" title="仅预览渲染结果(iframe)">预览</button>
                  <button class="html-mode-btn" data-mode="edit" id="html-mode-edit" title="仅编辑源码">编辑</button>
                  <button class="btn sm" id="html-open" title="打开本地 HTML 文件">📂 打开</button>
                  <button class="btn sm" id="html-add-lib" title="把当前打开的文档加入资源库指定分类(如「文档资源」)">＋ 加入库</button>
                  <button class="btn sm" id="html-save-as" title="另存为到指定路径">💾 另存为</button>
                  <button class="btn sm" id="html-save" title="保存回写原文件(Ctrl+S)">💾 保存</button>
                  <button class="btn sm" id="html-copy" title="复制源码">📋</button>
                  <span class="status" id="html-status"></span>
                </div>
                <div class="html-body">
                  <div class="html-col html-edit-col" id="html-edit-col">
                    <textarea id="html-edit" spellcheck="false" placeholder="在此编辑 HTML..."></textarea>
                  </div>
                  <div class="html-col html-preview-col" id="html-preview-col">
                    <iframe id="html-preview" class="html-preview" title="HTML 预览"></iframe>
                  </div>
                </div>
              </div>
            </div>

            <!-- FGUI 包查看:🧩 FGUI编辑器(默认) + 🗂 资源清单(逆向查看器) 双标签页 -->
            <div id="pv-fgui-view" hidden>
              <div class="fgui-pv-tabs">
                <button class="fgui-pv-tab active" data-pvtab="editor" title="用内置 FGUI 编辑器查看/编辑该包">🧩 FGUI编辑器</button>
                <button class="fgui-pv-tab" data-pvtab="list" title="组件清单 / 属性 / 源码逆向查看">🗂 资源清单</button>
              </div>
              <!-- FGUI 编辑器(内嵌 fguiEditorPage,完整 IDE:组件树/资源/画布/属性/编辑保存) -->
              <div class="fgui-pv-pane fgui-pv-editor" id="pv-fgui-editor"></div>
              <!-- 资源清单(原 FGUI 逆向查看器:组件清单 + 属性 + 源码) -->
              <div class="fgui-pv-pane fgui-pv-list" id="pv-fgui-list" style="display:none">
                <div class="fgui-viewer">
                  <div class="fgui-head">
                    <span class="fgui-name" id="fgui-name"></span>
                    <span class="fgui-badge" id="fgui-version"></span>
                    <span class="fgui-badge" id="fgui-pkg-id"></span>
                    <span class="fgui-meta">资源: <span id="fgui-items"></span></span>
                    <span class="fgui-meta">精灵: <span id="fgui-sprites"></span></span>
                    <span class="fgui-meta" title="依赖的其它 FGUI 包">依赖: <span id="fgui-deps"></span></span>
                    <div class="ctrl-spacer"></div>
                    <button class="btn sm" id="fgui-export-pkg" title="把当前目录下全部 FGUI 包导出为 JSON + XML 到所选目录">📤 导出全部包</button>
                    <button class="btn sm" id="fgui-copy-src" title="复制当前源码标签页内容">📋 复制</button>
                    <span class="status" id="fgui-status"></span>
                  </div>
                  <div class="fgui-body">
                    <div class="fgui-col fgui-comp-col">
                      <div class="fgui-col-title">
                        组件清单
                        <span class="fgui-badge" id="fgui-comp-type" style="margin-left:6px"></span>
                      </div>
                      <select id="fgui-comp-select" class="fgui-comp-select"></select>
                      <div class="fgui-tree" id="fgui-tree"></div>
                    </div>
                    <div class="fgui-col fgui-props-col">
                      <div class="fgui-col-title">属性</div>
                      <div class="fgui-props" id="fgui-props"><div class="hint">点击左侧树节点查看属性</div></div>
                    </div>
                    <div class="fgui-col fgui-src-col">
                      <div class="fgui-col-title">
                        <span class="fg-src-tab active" data-tab="component">组件 XML</span>
                        <span class="fg-src-tab" data-tab="package">包 XML</span>
                        <span class="fg-src-tab" data-tab="json">包 JSON</span>
                      </div>
                      <pre class="fgui-src" id="fgui-src"></pre>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 资源工具箱 -->
        <div class="page page-toolbox" id="page-toolbox" hidden></div>
        <!-- 项目管理中心(主页汇总 / 项目详情 / 项目资源文档) -->
        <div class="page page-projects" id="page-projects" hidden></div>
        <!-- 游戏场景管理 -->
        <div class="page page-scene" id="page-scene" hidden></div>
        <!-- FGUI 编辑器 -->
        <div class="page page-fgui-editor" id="page-fgui-editor" hidden></div>
        <!-- 网络资源抓取 -->
        <div class="page page-webgame" id="page-webgame" hidden></div>
        <!-- 开发工具箱:API 管理(内嵌 api-doc.html) -->
        <div class="page page-api" id="page-api" hidden></div>
        <!-- 图片图集拆分浏览 -->
        <div class="page page-atlas" id="page-atlas" hidden></div>
        <!-- 系统设置 -->
        <div class="page page-settings" id="page-settings" hidden></div>
        <!-- 自定义页面(终端节点目标页面,基于模板建立) -->
        <div class="page page-custom" id="page-custom" hidden></div>
        <!-- emoji 图标库浏览与管理 -->
        <div class="page page-emoji" id="page-emoji" hidden></div>
      </section>
    </div>
  </div>

  <div id="modal-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
